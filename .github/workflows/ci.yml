name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # The package has no tests, so the check is that it loads with its dependencies.
      - name: Load the connector
        run: node -e "require('./index.js')"
      - name: Package contents
        run: npm pack --dry-run
